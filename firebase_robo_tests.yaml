- displayName: Setup and Authentication
  id: setup_auth
  steps:
    - goal: Proceed past any welcome or terms screens
      hint: Tap next or agree to continue until you reach the login screen
    - goal: Log in as a distributor
      hint: Any valid username and password provided by the testing framework will work. Alternatively, look for a "Login" or "Submit" button
      successCriteria: The main app Dashboard screen is visible
      
- displayName: Core Flow - Dashboard Smoke Test
  id: dashboard_smoke
  prerequisiteTestCaseId: setup_auth
  steps:
    - goal: Verify dashboard sections are accessible
      hint: Scroll through the Dashboard Screen to ensure all quick actions and recent metrics are loaded
      successCriteria: Dashboard elements (Quick Actions, Notifications) are visible

- displayName: Core Flow - Order Entry
  id: test_order_entry
  prerequisiteTestCaseId: dashboard_smoke
  steps:
    - goal: Open the Order Entry page
      hint: Tap on the "New Order" or "Order Entry" card/button on the dashboard or from the bottom navigation
      successCriteria: The Order Entry screen is visible
    - goal: Interact with the order form
      hint: Select a product, enter a quantity using the number keys, and tap confirm or add to cart
    - goal: Submit the order
      hint: Tap the "Place Order" or "Submit" button at the bottom of the screen
      successCriteria: A success message is shown or the user is returned to the dashboard

- displayName: Verify Financial Reports
  id: test_financial_reports
  prerequisiteTestCaseId: dashboard_smoke
  steps:
    - goal: Open the Mini Statement page
      hint: Navigate to the bottom navigation bar or dashboard and tap "Mini Statement"
      successCriteria: Recent transaction rows are visible
    - goal: Go back to the dashboard
      hint: Use the physical back button, header back arrow, or bottom navigation
      successCriteria: The main app Dashboard screen is visible
    - goal: Open the Invoice Detail screen
      hint: Navigate to "Invoices" or tap on a recent invoice item from the dashboard

- displayName: Price & Disount verification
  id: test_pricing_discounts
  prerequisiteTestCaseId: dashboard_smoke
  steps:
    - goal: Open the Discount Page
      hint: Tap on "Discounts" or "Promotions"
      successCriteria: The discount policies or coupons are visible
    - goal: Go back to the dashboard
      hint: Use the physical back button or header back arrow
    - goal: Open the Price Details page
      hint: Tap on "Price List" or "Pricing"
      successCriteria: A list of products with their current prices is shown

- displayName: Customer Support & Profile
  id: test_support
  prerequisiteTestCaseId: dashboard_smoke
  steps:
    - goal: Open the Contact Us page
      hint: Tap on "Contact Support" or "Help" in the menu/profile section
      successCriteria: Support contact details or a form are visible
    - goal: Open the Bank Details page
      hint: Tap on "Bank Information" or a similar settings option
      successCriteria: Account or company banking details are shown
